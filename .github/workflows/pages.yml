name: Pubblica PWA su GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
