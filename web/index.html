function stableForDigest(value){
  if(Array.isArray(value)){
    const arr=value.map(stableForDigest);
    if(arr.every(x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.id!=null)){
      return arr.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id)));
    }
    return arr;
  }
  if(value&&typeof value==='object'){
    const out={};
    Object.keys(value).sort().forEach(k=>out[k]=stableForDigest(value[k]));
    return out;
  }
  return value;
}
function fastDigest(value){
  const text=JSON.stringify(stableForDigest(value));
  let h1=0x811c9dc5,h2=0x9e3779b9;
  for(let i=0;i<text.length;i++){
    const c=text.charCodeAt(i);
    h1^=c;h1=Math.imul(h1,0x01000193);
    h2^=c;h2=Math.imul(h2,0x85ebca6b);
  }
  return ((h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0'));
}

async function driveAuthToken(){
  if(!window.ortoCloud||typeof window.ortoCloud.getIdToken!=='function')throw new Error('Firebase non è ancora pronto.');
  const token=await window.ortoCloud.getIdToken();
  if(!token)throw new Error('Accedi prima all’orto condiviso.');

}
async function driveBackend(action,extra={},keepalive=false){
  if(!driveUi.endpoint)throw new Error('Backup Google Drive non configurato.');
  if(!navigator.onLine)throw new Error('Connessione Internet assente.');
  const idToken=await driveAuthToken();
  const body=JSON.stringify({action,channel:DRIVE_CHANNEL,idToken,...extra});
  const response=await fetch(driveUi.endpoint,{
    method:'POST',
    redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body,
    keepalive:!!keepalive && body.length<60000
  });
  const text=await response.text();
  let data;
  try{data=JSON.parse(text)}catch(_){throw new Error('Risposta backup non valida. Controlla il deployment Apps Script.')}
  if(!data?.ok)throw new Error(data?.error||'Backup Drive non riuscito.');
  return data;
}
function driveEnvelope(){
  const safe=cloudSafeState(state);
  return {
    format:'il-mio-orto-drive-backup',
    version:'v0.10.5',
    channel:DRIVE_CHANNEL,
    exportedAt:new Date().toISOString(),
    firestoreUpdatedAtMs:Number(cloudUi.cloudUpdatedAtMs)||0,
    digest:fastDigest(safe),
    state:safe
  };
}
function driveMarkDirty(){driveUi.dirty=true}

function isTransientDriveError(error){
  const msg=String(error?.message||error||'').toLowerCase();
  return msg.includes('failed to fetch') ||
         msg.includes('networkerror') ||
         msg.includes('network request') ||
         msg.includes('load failed');
}
function scheduleDriveAutoRetry(source='backup'){
  if(!driveUi.endpoint||!cloudUi.user||!navigator.onLine)return false;
  if(driveAutoRetryCount>=3)return false;
  driveAutoRetryCount++;
  const delay=[2200,4500,8000][driveAutoRetryCount-1]||8000;
  clearTimeout(driveCheckTimer);
  driveSetStatus({
    status:'checking',
    error:'',
    message:`Collegamento Drive in ritardo: nuovo tentativo automatico ${driveAutoRetryCount}/3…`
  });
  driveCheckTimer=setTimeout(()=>driveCheckAlignment(true),delay);
  return true;
}

function scheduleDriveBackup(reason='sync',delay=900){
  if(!driveUi.endpoint||!cloudUi.user||!navigator.onLine)return;
  clearTimeout(driveBackupTimer);
  driveBackupTimer=setTimeout(()=>driveBackupNow(reason),delay);
}
async function driveBackupNow(reason='manual',keepalive=false){
  if(!driveUi.endpoint){
    if(reason==='manual')alert('Configura prima il collegamento a Google Drive.');
    return false;
  }
  if(!cloudUi.user){
    if(reason==='manual')alert('Collega prima l’orto condiviso con email/password o Google.');
    return false;
  }
  if(!navigator.onLine){
    if(reason==='manual')alert('Connessione Internet assente. Il backup partirà quando torni online.');
    return false;
  }
  if(cloudUi.pending||cloudUi.status==='syncing'){
    scheduleDriveBackup(reason,1500);
    return false;
  }
  const payload=driveEnvelope();
  if(!payload.firestoreUpdatedAtMs){
    scheduleDriveBackup(reason,1500);
    return false;
  }
  driveSetStatus({status:'saving',message:'Salvataggio su Google Drive…',error:''});
  try{
    const result=await driveBackend('backup',{backup:payload,reason},keepalive);
    if(result.status==='newer_exists'){
      driveSetStatus({status:'newer',newer:true,remoteMeta:result.current||null,message:'Su Drive esiste un backup più recente: non è stato sovrascritto.',error:''});
      return false;
    }
    const now=new Date().toISOString();
    const remoteMeta=result.current||payload;
    const backupTime=remoteMeta.exportedAt||now;
    driveAutoRetryCount=0;
    driveUi.dirty=false;
    driveSetStatus({
      status:'ok',
      newer:false,
      remoteMeta,
      lastOk:backupTime,
      lastCheck:now,
      message:result.status==='unchanged'?'Allineato, nessuna modifica da salvare.':'Backup automatico completato.',
      error:''
    });
    return true;
  }catch(error){
    if(isTransientDriveError(error) && reason!=='manual' && scheduleDriveAutoRetry('backup')){
      return false;
    }
    driveSetStatus({status:'error',message:'',error:error.message||String(error)});
    return false;
  }
}
async function driveCheckAlignment(force=false){
  if(!driveUi.endpoint||!cloudUi.user||!navigator.onLine)return;
  if(cloudUi.pending||cloudUi.status==='syncing'||!cloudUi.cloudUpdatedAtMs){
    if(force||driveUi.dirty){
      clearTimeout(driveCheckTimer);
      driveCheckTimer=setTimeout(()=>driveCheckAlignment(force),1400);
    }
    return;
  }
  driveSetStatus({status:'checking',error:''});
  try{
    const result=await driveBackend('status');
    if(!result.current){
      driveSetStatus({status:'idle',remoteMeta:null,message:'Nessun backup Drive ancora presente.'});
      await driveBackupNow('prima-inizializzazione');
      return;
    }
    const current=driveEnvelope(),remote=result.current||{};
    driveUi.remoteMeta=remote;
    if(remote.digest===current.digest){
      const now=new Date().toISOString();
      driveAutoRetryCount=0;
      driveUi.dirty=false;
      driveSetStatus({
        status:'ok',
        newer:false,
        message:'Allineato, nessuna modifica da salvare.',
        lastOk:remote.exportedAt||driveUi.lastOk,
        lastCheck:now
      });
      return;
    }
    const remoteMs=Number(remote.firestoreUpdatedAtMs)||0,currentMs=Number(current.firestoreUpdatedAtMs)||0;
    if(remoteMs>currentMs+1500){
      driveSetStatus({
        status:'newer',
        newer:true,
        lastCheck:new Date().toISOString(),
        message:'Il backup su Drive risulta più recente di Firestore. Non lo sovrascrivo automaticamente.'
      });
      return;
    }
    driveSetStatus({
      status:'idle',
      newer:false,
      lastCheck:new Date().toISOString(),
      message:'Backup Drive da aggiornare.'
    });
    await driveBackupNow('allineamento-apertura');
  }catch(error){
    if(isTransientDriveError(error) && scheduleDriveAutoRetry('controllo')){
      return;
    }
    driveSetStatus({status:'error',error:error.message||String(error)});
  }
}
async function restoreFromDrive(){
  if(!driveUi.endpoint)return;
  if(!confirm('Ripristinare l’ultimo backup Google Drive? I dati attuali dell’orto verranno sostituiti e poi sincronizzati su Firestore.'))return;
  driveSetStatus({status:'checking',error:''});
  try{
    const result=await driveBackend('read');
    const backup=result.backup;
    if(!backup?.state)throw new Error('Il backup Drive non contiene dati ripristinabili.');
    state=cloudSafeState(backup.state);
    migratePlants();
    persistState();
    driveMarkDirty();
    queueCloudSync();
    driveSetStatus({status:'idle',newer:false,message:'Backup Drive caricato; sincronizzazione Firestore in corso.'});
    render();
  }catch(error){
    driveSetStatus({status:'error',error:error.message||String(error)});
  }
}

function initialPlants(count){count=Math.max(0,Math.min(100,Number(count)||0));if(!count)return[];let cols=Math.ceil(Math.sqrt(count)),rows=Math.ceil(count/cols),out=[];for(let i=0;i<count;i++){let col=i%cols,row=Math.floor(i/cols);out.push({id:uid(),x:(col+1)/(cols+1),y:(row+1)/(rows+1)})}return out}

function migratePlants(){
  if(!state||typeof state!=='object')state=emptyState();
  state.year=Number(state.year)||new Date().getFullYear();
  const rawCrops=Array.isArray(state.crops)?state.crops:[];
  state.tasks=Array.isArray(state.tasks)?state.tasks.filter(t=>t&&typeof t==='object'):[];
  state.harvests=Array.isArray(state.harvests)?state.harvests.filter(h=>h&&typeof h==='object'):[];
  state.harvests=state.harvests.map(h=>({id:String(h.id||uid()),date:String(h.date||new Date().toISOString().slice(0,10)),name:String(h.name||h.cropName||'Prodotto'),weight:Math.max(0,Math.round(Number(h.weight!=null?h.weight:h.weightGrams)||0))})).filter(h=>h.name.trim()&&h.weight>0);
  state.history=Array.isArray(state.history)?state.history.filter(h=>h&&typeof h==='object'):[];
  state.history.forEach(h=>{h.id=String(h.id||uid());h.year=Number(h.year)||state.year-1;h.zone=String(h.zone||'proda_1');h.speciesId=String(h.speciesId||'');h.speciesName=String(h.speciesName||'');});
  state.activityLog=Array.isArray(state.activityLog)?state.activityLog.filter(x=>x&&typeof x==='object'):[];
  state.activityLog.forEach(x=>{x.id=String(x.id||uid());x.date=String(x.date||new Date().toISOString().slice(0,10));x.title=String(x.title||'Attività');x.category=String(x.category||'Cura');x.zone=String(x.zone||'');x.cropId=String(x.cropId||'');x.cropName=String(x.cropName||'');x.taskId=String(x.taskId||'');x.suggestionKey=String(x.suggestionKey||'');});
  state.ignoredSuggestions=Array.isArray(state.ignoredSuggestions)?state.ignoredSuggestions.filter(x=>x&&typeof x==='object'):[];
  state.ignoredSuggestions.forEach(x=>{x.id=String(x.id||uid());x.key=String(x.key||'');x.date=String(x.date||new Date().toISOString().slice(0,10));});
  state.crops=[];
  rawCrops.forEach((raw,index)=>{
    try{
      if(!raw||typeof raw!=='object')return;
      const c=raw;
      c.id=String(c.id||uid());
      c.zone=String(c.zone||'proda_1');
      if(!zones.some(z=>z[0]===c.zone))c.zone='proda_1';
      c.name=String(c.name||'Pianta');
      c.variety=String(c.variety||'');
      const oldCount=c.count!=null?c.count:c.plantCount;
      c.count=Math.max(0,Math.min(100,Number(oldCount)||0));
      const inferred=inferCatalog(c.name);
      c.catalogId=String(c.catalogId||(inferred?inferred.id:'custom'));
      c.iconDiameterCm=safeDiameter(c.iconDiameterCm==null?(inferred?inferred.iconDiameterCm:20):c.iconDiameterCm);
      c.spacingCm=safeSpacing(c.spacingCm,inferred?inferred.spacingCm:30);
      c.rowSpacingCm=safeSpacing(c.rowSpacingCm,inferred?inferred.rowSpacingCm:40);
      c.iconColor=String(c.iconColor||(inferred?inferred.color:'#c9e2bd'));
      if(!Array.isArray(c.plants))c.plants=[];
      c.plants=c.plants.filter(p=>p&&typeof p==='object');
      while(c.plants.length<c.count){
        const missing=c.count-c.plants.length;
        const generated=initialPlants(missing);
        if(!generated.length)break;
        c.plants.push(...generated);
      }
      if(c.plants.length>c.count)c.plants=c.plants.slice(0,c.count);
      const limits=radiusFractions(c);
      c.plants.forEach(p=>{
        p.id=String(p.id||uid());
        let x=Number(p.x),y=Number(p.y);
        if(!Number.isFinite(x))x=.5;
        if(!Number.isFinite(y))y=.5;
        p.x=Math.max(limits.x,Math.min(1-limits.x,x));
        p.y=Math.max(limits.y,Math.min(1-limits.y,y));
      });
      state.crops.push(c);
    }catch(error){
      console.warn('Coltura non compatibile ignorata alla posizione '+index,error);
    }
  });
  return true;
}

function axisCandidates(min,max,step){
  if(max<min)return [(min+max)/2];
  const values=[];
  for(let value=min;value<=max+0.001;value+=step)values.push(Math.min(max,value));
  if(!values.length||Math.abs(values[values.length-1]-max)>.25)values.push(max);
  return values;
}

function tryPlaceItems(zoneId,safetyCm,stepCm){

function calendarView(){
  const byDate={};
  state.tasks.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    (byDate[t.date]??=[]).push(t);
  });

  function groupedDay(tasks){
    const groups={};
    tasks.forEach(t=>{
      const activity=String(t.category||t.title||'Altro').trim()||'Altro';
      const zone=t.zone||'';
      const key=activity+'||'+zone;
      if(!groups[key])groups[key]={activity,zone,tasks:[]};
      groups[key].tasks.push(t);
    });

    return Object.values(groups).map(group=>{
      const place=zoneName(group.zone)||'Orto';
      const entries=[];
      const seen=new Set();

      group.tasks.forEach(t=>{
        const crop=taskCropName(t);
        const label=crop||t.title||group.activity;
        const key=(crop||label)+'||'+(t.done?'1':'0');
        if(seen.has(key))return;
        seen.add(key);
        entries.push({
          label,
          emoji:crop?emojiFor(crop):taskIcon(t),
          done:!!t.done
        });
      });

      return `<div class="cal-activity">
        <div class="cal-activity-title">${esc(group.activity)}</div>
        <div class="cal-zone-row">
          ${entries.map((e,i)=>`${i?'<span class="cal-sep">·</span>':''}<span class="cal-crop ${e.done?'cal-done':''}">${e.done?'✓ ':''}${e.emoji} ${esc(e.label)} <span class="cal-place">(${esc(place)})</span></span>`).join('')}
        </div>
      </div>`;
    }).join('');
  }

  return `<h1 class="title">Calendario</h1>
    <p class="sub">Agenda cronologica delle attività.</p>
    <div class="stats">
      <div class="stat"><strong>${state.tasks.filter(t=>!t.done).length}</strong>da fare</div>
      <div class="stat"><strong>${state.tasks.filter(t=>t.done).length}</strong>completate</div>
      <div class="stat"><strong>${Object.keys(byDate).length}</strong>giorni</div>
    </div>
    ${Object.keys(byDate).length
      ? Object.entries(byDate).map(([date,tasks])=>`
          <div class="card">
            <div class="cal-date">${formatDateIt(date)}</div>
            ${groupedDay(tasks)}
          </div>`).join('')
      : '<div class="card empty">📅 Nessuna attività programmata.</div>'}`;
}

let companionCropId='pomodoro';
const rolePriority={edge:0,stake:1,companion:2,compact:3,row:3,free:4};
function cropCatalogId(crop){return (catalogItem(crop.catalogId)||inferCatalog(crop.name)||{}).id||'custom'}
function cropRole(crop){const id=cropCatalogId(crop);if(['zucchino','trombetta','hokkaido'].includes(id))return'edge';if(['pomodoro','fagiolino','cetriolo'].includes(id))return'stake';if(['basilico','tagete'].includes(id))return'companion';if(['lattuga','rucola','cipolla','porro','barbabietola','finocchio','prezzemolo'].includes(id))return'compact';return'row'}
function roleText(role){return({edge:'lungo un bordo',stake:'in file/tutori',companion:'vicino alla coltura associata',compact:'in file compatte',row:'in file regolari',free:'posizione libera'})[role]||role}
function pairRule(a,b){const ai=cropCatalogId(a),bi=cropCatalogId(b);return companionRules.find(r=>(r.a===ai&&r.b===bi)||(r.a===bi&&r.b===ai))||null}
function centerDistanceCm(a,b,d){return Math.hypot((a.plant.x-b.plant.x)*d.w*100,(a.plant.y-b.plant.y)*d.l*100)}
function physicalRequiredDistance(a,b){
 return (safeDiameter(a.crop.iconDiameterCm)+safeDiameter(b.crop.iconDiameterCm))/2+AUTO_CLEARANCE_CM;
}
function strictRequiredDistance(a,b){
 const physical=physicalRequiredDistance(a,b);
 const spacingA=safeSpacing(a.crop.spacingCm,30);
 const spacingB=safeSpacing(b.crop.spacingCm,30);
 if(sameCropIdentity(a.crop,b.crop))return Math.max(physical,spacingA,spacingB);

 // In una proda mista le distanze monocolturali non vanno sommate o mediate:
 // specie diverse possono occupare in parte spazi complementari.
 // Restano obbligatori l'ingombro fisico, la distanza della coltura più fitta
 // e l'eventuale minimo specifico di consociazione.
 const mixedMinimum=Math.min(spacingA,spacingB)*0.75;
 const rule=pairRule(a.crop,b.crop);
 const ruleMin=rule&&rule.minCm?Number(rule.minCm):0;
 return Math.max(physical,mixedMinimum,ruleMin);

function preferredColumns(item,W){
 const r=item.radius;
 let gap=Math.max(10,safeSpacing(item.crop.rowSpacingCm,40));
 let cols=Math.max(1,Math.floor((W-2*r)/gap)+1);
 cols=Math.min(3,cols);
 if(cols===1)return[W/2];

 let span=(cols-1)*gap;
 if(span>W-2*r){
   span=W-2*r;
   gap=span/(cols-1);
 }
 const start=(W-span)/2;
 return Array.from({length:cols},(_,i)=>start+i*gap);
}
function roleScore(item,x,y,placed,W,L){
 const role=cropRole(item.crop),same=placed.filter(p=>sameCropIdentity(p.item.crop,item.crop));
 const nearestSame=same.length?Math.min(...same.map(p=>Math.hypot(x-p.x,y-p.y))):0;
 if(role==='edge'){
   const preferredEdge=Math.min(x-item.radius,W-x-item.radius,L-y-item.radius);
   const lowerHalfPenalty=y<L*.52?(L*.52-y)*12:0;
   return preferredEdge*35+lowerHalfPenalty+nearestSame*.08-x*.002;
 }
 if(role==='stake'){
   const cols=preferredColumns(item,W),columnPenalty=Math.min(...cols.map(cx=>Math.abs(x-cx)));
   return columnPenalty*55+y*.08+nearestSame*.04;
 }
 if(role==='companion'){
   const targets=placed.filter(p=>{const r=pairRule(item.crop,p.item.crop);return r&&r.relation!=='uncertain'});
   if(targets.length){const best=Math.min(...targets.map(p=>{const r=pairRule(item.crop,p.item.crop),dist=Math.hypot(x-p.x,y-p.y),ideal=((r.minCm||20)+(r.maxCm||50))/2;return Math.abs(dist-ideal)}));return best*55+y*.03+nearestSame*.08}
   return 8000+y*.05+nearestSame*.05;
 }
 return y*.08+x*.01+nearestSame*.06;
}

function agrUniqueNumbers(values){
 const out=[];
 values.forEach(v=>{
   const n=Number(v);
   if(!Number.isFinite(n))return;
   if(!out.some(x=>Math.abs(x-n)<.1))out.push(n);
 });
 return out.sort((a,b)=>a-b);
}
function agrAxisValues(max,step=10){
 if(max<=.05)return[0];
 const vals=[0,max/2,max];
 for(let v=0;v<=max+.05;v+=step)vals.push(Math.min(max,v));
 return agrUniqueNumbers(vals);
}
function agrGroupItems(zoneId,excludedCropIds=[]){
 const excluded=new Set(excludedCropIds);
 const map=new Map();
 placementItems(zoneId).forEach(item=>{
   if(excluded.has(item.crop.id))return;
   const key=item.crop.id||cropTypeKey(item.crop.name,item.crop.variety);
   if(!map.has(key))map.set(key,{key,crop:item.crop,items:[],role:cropRole(item.crop)});
   map.get(key).items.push(item);
 });
 return [...map.values()];
}
function agrPattern(group,cols,dx,dy,W,edgeMode=false,edgeGap=null,edgePhase=0){
 const {items,crop,role}=group;
 const n=items.length,r=items[0]?.radius||safeDiameter(crop.iconDiameterCm)/2;
 const points=[];

 if(edgeMode){
   const gap=Math.max(edgeGap||safeSpacing(crop.spacingCm,30),r*2+AUTO_CLEARANCE_CM);
   for(let i=0;i<n;i++){
     const side=i%2,row=Math.floor(i/2);
     points.push({
       item:items[i],
       x:side?W-r:r,
       y:r+row*gap+(side?edgePhase*gap:0)
     });
   }
 }else{
   const rows=Math.ceil(n/cols);
   for(let row=0;row<rows;row++){
     const from=row*cols;
     const count=Math.min(cols,n-from);
     const offset=((cols-count)*dx)/2;
     for(let col=0;col<count;col++){
       const i=from+col;
       points.push({
         item:items[i],
         x:r+offset+col*dx,
         y:r+row*dy
       });
     }
   }
 }

 const minX=Math.min(...points.map(p=>p.x-p.item.radius));
 const maxX=Math.max(...points.map(p=>p.x+p.item.radius));
 const minY=Math.min(...points.map(p=>p.y-p.item.radius));
 const maxY=Math.max(...points.map(p=>p.y+p.item.radius));
 const norm=points.map(p=>({...p,x:p.x-minX,y:p.y-minY}));

 return{
   group,points:norm,
   w:maxX-minX,h:maxY-minY,
   cols,role,edge:edgeMode
 };
}
function agrPatternsForGroup(group,W,L){
 const {items,crop,role}=group;
 if(!items.length)return[];
 const n=items.length,r=items[0].radius;
 const physical=r*2+AUTO_CLEARANCE_CM;
 const spacing=Math.max(physical,safeSpacing(crop.spacingCm,30));
 const rowGap=Math.max(physical,safeSpacing(crop.rowSpacingCm,40));
 const patterns=[];

 if(role==='edge'){
   const gaps=agrUniqueNumbers([spacing,spacing*1.15,spacing*1.30,spacing*1.45]);
   gaps.forEach(gap=>{
     [0,.5].forEach(phase=>{
       const p=agrPattern(group,2,0,0,W,true,gap,phase);
       if(p.h<=L+.05)patterns.push(p);
     });
   });
   // Se le piante sono poche, prova anche una sola fila laterale.
   if(n<=4){
     for(const side of ['left','right']){
       const pts=items.map((item,i)=>({
         item,
         x:side==='left'?r:W-r,
         y:r+i*spacing
       }));
       const minX=Math.min(...pts.map(p=>p.x-p.item.radius));
       const maxX=Math.max(...pts.map(p=>p.x+p.item.radius));
       const minY=Math.min(...pts.map(p=>p.y-p.item.radius));
       const maxY=Math.max(...pts.map(p=>p.y+p.item.radius));
       if(maxY-minY<=L+.05){
         patterns.push({
           group,
           points:pts.map(p=>({...p,x:p.x-minX,y:p.y-minY})),
           w:maxX-minX,h:maxY-minY,
           cols:1,role,edge:true,side
         });
       }
     }
   }
   return patterns;
 }

 const widthCols=Math.max(1,Math.floor((W-2*r)/spacing)+1);
 const maxCols=Math.min(
   n,
   role==='compact'||role==='row'?widthCols:
   role==='companion'?4:
   3
 );
 for(let cols=1;cols<=maxCols;cols++){
   const p=agrPattern(group,cols,rowGap,spacing,W,false);
   if(p.w<=W+.05&&p.h<=L+.05)patterns.push(p);
 }
 return patterns;
}
function agrCandidateScore(candidate,W,L){
 const {pattern,x,y}=candidate;
 const role=pattern.role;
 const cx=x+pattern.w/2,cy=y+pattern.h/2;
 const n=pattern.group.items.length;
 let score=0;

 if(role==='edge'){
   score+=Math.abs(cy-L*.45)*.012;
   score+=pattern.cols===2?0:2;
 }else if(role==='stake'){
   score+=Math.abs(cx-W/2)*.32;
   score+=Math.abs(cy-L*.62)*.012;
   const preferred=n>=7?3:(n>=4?2:1);
   score+=Math.abs(pattern.cols-preferred)*1.4;
 }else if(role==='compact'||role==='row'){
   score+=y*.032;                         // tendenzialmente verso la testa della proda
   score+=Math.abs(cx-W/2)*.035;
   const r0=pattern.group.items[0]?.radius||0;
   const spacing0=Math.max(r0*2+AUTO_CLEARANCE_CM,safeSpacing(pattern.group.crop.spacingCm,30));
   const widthCols=Math.max(1,Math.floor((W-2*r0)/spacing0)+1);
   const preferred=Math.min(n,widthCols);
   score+=Math.abs(pattern.cols-preferred)*.8;
 }else if(role==='companion'){
   score+=y*.018+Math.abs(cx-W/2)*.02;
 }
 return score;
}
function agrCandidatesForGroup(group,W,L,maxCandidates=900){
 const out=[];
 agrPatternsForGroup(group,W,L).forEach(pattern=>{
   const maxX=Math.max(0,W-pattern.w);
   const maxY=Math.max(0,L-pattern.h);

   if(pattern.edge&&pattern.w>=W-.1){
     agrAxisValues(maxY,10).forEach(y=>{
       out.push({
         group,pattern,x:0,y,
         points:pattern.points.map(p=>({...p,x:p.x,y:p.y+y}))
       });
     });
   }else{
     const xs=agrAxisValues(maxX,10);
     const ys=agrAxisValues(maxY,10);
     xs.forEach(x=>ys.forEach(y=>{
       out.push({
         group,pattern,x,y,
         points:pattern.points.map(p=>({...p,x:p.x+x,y:p.y+y}))
       });
     }));
   }
 });
 out.forEach(c=>c.score=agrCandidateScore(c,W,L));
 out.sort((a,b)=>a.score-b.score||a.y-b.y||a.x-b.x);
 return out.slice(0,maxCandidates);
}
function agrRectanglesConflict(a,b,gap=5){
 const ra=a.pattern.role,rb=b.pattern.role;
 // Colture da bordo possono condividere la stessa fascia longitudinale.
 // Le companion possono stare nello spazio di una coltura associata.
 if(ra==='edge'||rb==='edge'||ra==='companion'||rb==='companion')return false;

 const ax1=a.x,ay1=a.y,ax2=a.x+a.pattern.w,ay2=a.y+a.pattern.h;
 const bx1=b.x,by1=b.y,bx2=b.x+b.pattern.w,by2=b.y+b.pattern.h;
 return !(ax2+gap<=bx1||bx2+gap<=ax1||ay2+gap<=by1||by2+gap<=ay1);
}
function agrCandidatesCompatible(candidate,placements){
 for(const other of placements){
   if(agrRectanglesConflict(candidate,other))return false;
   for(const a of candidate.points){
     for(const b of other.points){
       const dist=Math.hypot(a.x-b.x,a.y-b.y);
       if(dist+.05<strictRequiredDistance(a.item,b.item))return false;
     }
   }
 }
 return true;
}
function agrAdjacencyPenalty(candidate,placements){
 let penalty=0;
 for(const other of placements){
   const r=pairRule(candidate.group.crop,other.group.crop);
   if(!r||r.relation==='uncertain')continue;

   const ax=candidate.x+candidate.pattern.w/2;
   const ay=candidate.y+candidate.pattern.h/2;
   const bx=other.x+other.pattern.w/2;
   const by=other.y+other.pattern.h/2;
   const d=Math.hypot(ax-bx,ay-by);

   // B = lieve preferenza di vicinanza; C è già gestita prima del progetto.
   if(r.relation==='good'||r.code==='B')penalty+=d*.002;
 }
 return penalty;
}
function createAgronomicPlan(zoneId,excludedCropIds=[],maxAttempts=1){
 const d=zoneDims(zoneId),W=d.w*100,L=d.l*100;
 const groups=agrGroupItems(zoneId,excludedCropIds);
 const total=groups.reduce((s,g)=>s+g.items.length,0);
 if(!total)return{success:true,placed:[],W,L,total:0,groups:[]};

 const prepared=groups.map(group=>{
   const candidates=agrCandidatesForGroup(group,W,L,group.items.length>15?600:900);
   return{group,candidates};
 });

 // Prima i gruppi più difficili da collocare: meno alternative = prima.
 prepared.sort((a,b)=>
   (rolePriority[a.group.role]??9)-(rolePriority[b.group.role]??9) ||
   a.candidates.length-b.candidates.length ||
   b.group.items.length-a.group.items.length
 );

 if(prepared.some(x=>!x.candidates.length)){
   const failed=prepared.find(x=>!x.candidates.length)?.group.items[0];
   return{success:false,placed:[],failed,W,L,total,reason:'pattern'};
 }

 const BEAM_WIDTH=180;
 let beam=[{score:0,placements:[]}];
 let failedGroup=null;

 for(const entry of prepared){
   const next=[];
   for(const state of beam){
     for(const candidate of entry.candidates){
       if(!agrCandidatesCompatible(candidate,state.placements))continue;
       const score=state.score+candidate.score+agrAdjacencyPenalty(candidate,state.placements);
       next.push({
         score,
         placements:[...state.placements,candidate]
       });
     }
   }
   if(!next.length){
     failedGroup=entry.group;
     beam=[];
     break;
   }
   next.sort((a,b)=>a.score-b.score);
   beam=next.slice(0,BEAM_WIDTH);
 }

 if(!beam.length){
   return{
     success:false,placed:[],
     failed:failedGroup?.items?.[0]||prepared[0]?.group?.items?.[0],
     W,L,total,reason:'no-layout'
   };
 }

 const best=beam[0];
 const placed=[];
 best.placements.forEach(c=>{
   c.points.forEach(p=>placed.push({item:p.item,x:p.x,y:p.y}));
 });

 return{
   success:true,placed,W,L,total,
   groups:best.placements.map(c=>({
     cropId:c.group.crop.id,
     role:c.group.role,
     x:c.x,y:c.y,w:c.pattern.w,h:c.pattern.h,cols:c.pattern.cols
   }))
 };
}
function applyAgronomicPlan(plan){
 plan.placed.forEach(p=>{
   p.item.plant.x=p.x/plan.W;
   p.item.plant.y=p.y/plan.L;
 });
}

function cropGroups(zoneId){return state.crops.filter(c=>c.zone===zoneId&&c.count>0)}
function findMoveSuggestions(zoneId){
 const groups=cropGroups(zoneId).slice().sort((a,b)=>a.count-b.count||safeDiameter(b.iconDiameterCm)-safeDiameter(a.iconDiameterCm));
 const suggestions=[];
 for(const crop of groups){
   const plan=createAgronomicPlan(zoneId,[crop.id],4);
   if(plan.success)suggestions.push({ids:[crop.id],labels:[`${crop.count} ${crop.name}`],count:crop.count});
 }
 if(!suggestions.length&&groups.length<=8){
   for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++){
     const plan=createAgronomicPlan(zoneId,[groups[i].id,groups[j].id],3);
     if(plan.success)suggestions.push({ids:[groups[i].id,groups[j].id],labels:[`${groups[i].count} ${groups[i].name}`,`${groups[j].count} ${groups[j].name}`],count:groups[i].count+groups[j].count});
   }
 }
 const sorted=suggestions.sort((a,b)=>a.count-b.count);if(!sorted.length)return[];const min=sorted[0].count;return sorted.filter(s=>s.count<=min+2).slice(0,3);
}
function arrangeZonePlants(zoneId){
 const plan=createAgronomicPlan(zoneId);
 if(!plan.success){
   return{
     success:false,
     remaining:plan.total||1,
     plan,
     suggestions:findMoveSuggestions(zoneId)
   };
 }

 const previous=zonePlants(zoneId).map(x=>({plant:x.plant,x:x.plant.x,y:x.plant.y}));
 applyAgronomicPlan(plan);
 const residual=spacingWarnings(zoneId);

 if(residual.length){
   previous.forEach(p=>{p.plant.x=p.x;p.plant.y=p.y});
   return{
     success:false,
     remaining:residual.length,
     plan:{...plan,failed:residual[0]?.a||plan.failed},
     suggestions:findMoveSuggestions(zoneId),
     residual
   };
 }
 return{success:true,remaining:0,plan,residual:[]};
}

function plannerFailureSheet(zoneId,result){
 const failed=result.plan.failed,sg=result.suggestions||[];
 openSheet(`<h2>La combinazione non entra in modo ordinato</h2>
 <p>Il progettista non sparpaglia più le piante per far tornare artificialmente le distanze. Con le quantità attuali non riesce a mantenere contemporaneamente <b>gruppi/file ordinati</b> e tutte le distanze richieste${failed?`, a partire da <b>${emojiFor(failed.crop.name)} ${esc(failed.crop.name)}</b>`:''}.</p>
 ${sg.length?`<div class="planner-result fail"><b>Soluzioni che rendono possibile il progetto:</b>${sg.map(s=>`<div class="planner-suggestion">Sposta in un’altra zona: <b>${s.labels.map(esc).join(' + ')}</b></div>`).join('')}</div>`:`<div class="planner-result fail">Occorre ridurre il numero di piante oppure spostare almeno una coltura in un’altra zona.</div>`}
 <div class="actions"><button class="btn" onclick="closeSheet()">Chiudi</button></div>`);
}

function autoArrangeZone(zoneId,ignoreRelations=false){
 const count=zonePlants(zoneId).length;
 if(!count)return;

 const conflicts=matrixPairWarnings(zoneId).filter(x=>x.relation.code==='C');
 if(conflicts.length&&!ignoreRelations){
   openSheet(`<h2>Consociazioni da verificare</h2><p>Il database segnala ${conflicts.length} combinazioni da evitare in questa zona:</p>${conflicts.map(x=>`<div class="matrix-warning C"><b>${emojiFor(x.a.name)} ${esc(x.a.name)} + ${emojiFor(x.b.name)} ${esc(x.b.name)}</b><br>${esc(x.relation.source)}</div>`).join('')}<p class="muted">La disposizione automatica non può risolvere un conflitto agronomico semplicemente spostando le icone. Puoi annullare o continuare consapevolmente.</p><div class="actions"><button class="btn out" onclick="closeSheet()">Annulla</button><button class="btn warn" onclick="closeSheet();autoArrangeZone('${zoneId}',true)">Continua comunque</button></div>`);
   return;
 }

 const result=arrangeZonePlants(zoneId);
 if(result.success){
   selectedPlantId=zonePlants(zoneId)[0]?.plant.id||'';
   save();
   setTimeout(()=>alert('Proda riprogettata: ogni coltura è mantenuta in file o blocchi regolari e tutte le distanze risultano rispettate.'),20);
 }else{
   plannerFailureSheet(zoneId,result);
 }
}

function companionConstraintWarnings(zoneId){
 const all=zonePlants(zoneId),d=zoneDims(zoneId),out=[];
 for(const entry of all){const role=cropRole(entry.crop),x=entry.plant.x*d.w*100,y=entry.plant.y*d.l*100,r=safeDiameter(entry.crop.iconDiameterCm)/2;
   if(role==='edge'){const edge=Math.min(x-r,d.w*100-x-r,d.l*100-y-r);if(edge>30)out.push({type:'position',entry,text:`${entry.crop.name} ${entry.index}: dovrebbe stare lungo un bordo (ora è a ${Math.round(edge)} cm dal bordo utile più vicino).`})}
   if(role==='companion'){
     const rules=companionRules.filter(rule=>rule.relation!=='uncertain'&&(rule.a===cropCatalogId(entry.crop)||rule.b===cropCatalogId(entry.crop)));
     for(const rule of rules){const targetId=rule.a===cropCatalogId(entry.crop)?rule.b:rule.a,targets=all.filter(q=>cropCatalogId(q.crop)===targetId);if(!targets.length)continue;const nearest=Math.min(...targets.map(q=>centerDistanceCm(entry,q,d)));if(rule.maxCm&&nearest>rule.maxCm)out.push({type:'companion',entry,text:`${entry.crop.name} ${entry.index}: è a ${Math.round(nearest)} cm dalla coltura associata; obiettivo massimo ${rule.maxCm} cm.`})}
   }
 }

const gardenRef=doc(db,'gardens','main');
const names=['crops','tasks','harvests','history','activityLog','ignoredSuggestions'];
let currentUser=null,unsubs=[],remoteMaps=Object.fromEntries(names.map(n=>[n,new Map()])),meta={year:new Date().getFullYear()},listenerReady=new Set(),serverInitialized=false,syncTimer=null,syncing=false,lastQueuedState=null;
const clean=v=>JSON.parse(JSON.stringify(v));
const bridge=()=>window.__ortoCloudBridge;
function setStatus(p){bridge()?.cloudStatusUpdate?.(p)}
function clearListeners(){unsubs.forEach(fn=>{try{fn()}catch(_){}});unsubs=[];listenerReady=new Set()}
function rebuilt(){return {year:Number(meta.year)||new Date().getFullYear(),...Object.fromEntries(names.map(n=>[n,[...remoteMaps[n].values()]]))}}
function applyIfReady(snapshotMeta){if(listenerReady.size<names.length+1)return;bridge()?.applyCloudState?.(rebuilt(),snapshotMeta||{})}
async function seedFromLocal(local){const s=clean(local||bridge()?.getState?.()||{}),batch=writeBatch(db);batch.set(gardenRef,{year:Number(s.year)||new Date().getFullYear(),updatedAt:serverTimestamp(),updatedBy:currentUser?.uid||'',updatedByEmail:currentUser?.email||''},{merge:true});for(const name of names){for(const item of (s[name]||[])){if(!item?.id)continue;batch.set(doc(collection(gardenRef,name),String(item.id)),clean(item))}}await batch.commit()}
async function ensureServerGarden(){try{const snap=await getDocFromServer(gardenRef);if(!snap.exists()){setStatus({status:'syncing',message:'Creo il primo orto condiviso…'});await seedFromLocal(bridge()?.getState?.());}serverInitialized=true;attachListeners()}catch(error){console.warn('Firestore server non raggiungibile:',error);serverInitialized=true;attachListeners();setStatus({fromCache:true,status:'synced',error:''})}}
function attachListeners(){clearListeners();unsubs.push(onSnapshot(gardenRef,{includeMetadataChanges:true},snap=>{if(snap.exists())meta=snap.data()||meta;const cloudUpdatedAtMs=meta?.updatedAt?.toMillis?.()||0;listenerReady.add('meta');applyIfReady({fromCache:snap.metadata.fromCache,pending:snap.metadata.hasPendingWrites});setStatus({fromCache:snap.metadata.fromCache,pending:snap.metadata.hasPendingWrites,status:'synced',error:'',cloudUpdatedAtMs})},err=>setStatus({error:'Sincronizzazione meta: '+err.message,status:'error'})));for(const name of names){unsubs.push(onSnapshot(collection(gardenRef,name),{includeMetadataChanges:true},snap=>{const m=new Map();snap.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));remoteMaps[name]=m;listenerReady.add(name);applyIfReady({fromCache:snap.metadata.fromCache,pending:snap.metadata.hasPendingWrites});setStatus({fromCache:snap.metadata.fromCache,pending:snap.metadata.hasPendingWrites,status:'synced',error:''})},err=>setStatus({error:'Sincronizzazione '+name+': '+err.message,status:'error'})))}}
async function pushState(s,force=false){if(!currentUser||syncing)return;syncing=true;setStatus({status:'syncing',pending:true,error:''});try{const next=clean(s||bridge()?.getState?.()||{}),batch=writeBatch(db);batch.set(gardenRef,{year:Number(next.year)||new Date().getFullYear(),updatedAt:serverTimestamp(),updatedBy:currentUser.uid,updatedByEmail:currentUser.email||''},{merge:true});for(const name of names){const incoming=new Map((next[name]||[]).filter(x=>x&&x.id).map(x=>[String(x.id),x]));for(const [id,item] of incoming)batch.set(doc(collection(gardenRef,name),id),clean(item));for(const id of remoteMaps[name].keys())if(!incoming.has(id))batch.delete(doc(collection(gardenRef,name),id));}await batch.commit();
    let cloudUpdatedAtMs=0;
    try{
      const metaSnap=await getDocFromServer(gardenRef);
      cloudUpdatedAtMs=metaSnap.data()?.updatedAt?.toMillis?.()||0;
    }catch(_){}
    setStatus({status:'synced',pending:false,error:'',lastSync:new Date().toISOString(),cloudUpdatedAtMs});
    bridge()?.driveCloudSynced?.(cloudUpdatedAtMs)}catch(error){console.error('Scrittura Firestore:',error);setStatus({status:'error',pending:false,error:'Sync non riuscita: '+error.message})}finally{syncing=false;if(lastQueuedState){const q=lastQueuedState;lastQueuedState=null;queueSync(q)}}}
function queueSync(s){lastQueuedState=clean(s);clearTimeout(syncTimer);syncTimer=setTimeout(()=>{const q=lastQueuedState;lastQueuedState=null;if(q)pushState(q)},650)}
async function loginEmail(email,password){
  setStatus({status:'syncing',error:''});
  try{
    await signInWithEmailAndPassword(auth,email,password);
    if(document.getElementById('modal')?.classList.contains('show')) bridge()?.closeCloudPanel?.();
  }catch(error){
    console.error('Accesso email/password:',error);
    const code=String(error?.code||'');
    const friendly =
      code==='auth/invalid-credential' || code==='auth/wrong-password' || code==='auth/user-not-found'
      ? 'Email o password non corretti.'
      : code==='auth/invalid-email'
      ? 'Indirizzo email non valido.'
      : code==='auth/too-many-requests'
      ? 'Troppi tentativi di accesso. Attendi qualche minuto e riprova.'
      : code==='auth/network-request-failed'
      ? 'Problema di connessione. Controlla Internet e riprova.'
      : 'Accesso email/password: '+(error?.message||error);
    setStatus({error:friendly,status:'error'});
    bridge()?.showCloudPanel?.();
  }
}

async function login(){
  setStatus({status:'syncing',error:''});
  try{
    await signInWithPopup(auth,provider);
    if(document.getElementById('modal')?.classList.contains('show')) bridge()?.closeCloudPanel?.();
  }catch(error){
    console.error('Accesso Google:',error);
    const friendly = error?.code==='auth/popup-blocked'
      ? 'Il browser ha bloccato la finestra di accesso Google. Consenti i popup per questo sito e riprova.'
      : error?.code==='auth/popup-closed-by-user'
      ? 'La finestra Google è stata chiusa prima di completare l’accesso.'
      : 'Accesso Google: '+(error?.message||error);
    setStatus({error:friendly,status:'error'});
    bridge()?.showCloudPanel?.();
  }
}
async function logout(){clearListeners();await signOut(auth)}
window.ortoCloud={login,loginEmail,logout,queueSync,syncNow:()=>pushState(bridge()?.getState?.()),forceSync:s=>pushState(s,true),getIdToken:async()=>currentUser?currentUser.getIdToken():''};
onAuthStateChanged(auth,user=>{currentUser=user||null;clearListeners();bridge()?.cloudUserChanged?.(user?{uid:user.uid,email:user.email||'',displayName:user.displayName||'',photoURL:user.photoURL||''}:null);if(user)ensureServerGarden()});
</script>
